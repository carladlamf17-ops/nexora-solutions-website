<svg xmlns="http://www.w3.org/2000/svg" width="960" height="453" viewBox="0 0 960 453" role="img" aria-labelledby="title">
  <title id="title">Alleged summons received over chat — SIMULATED · EDUCATIONAL EXAMPLE</title>
  <rect width="960" height="453" fill="#f6f8fc"/>
  <g font-family="system-ui, sans-serif">
    <rect width="960" height="72" fill="#8b1731"/>
    <text x="42" y="45" fill="#fff" font-size="24" font-weight="750">SIMULATED · EDUCATIONAL EXAMPLE</text>
    <text x="42" y="126" fill="#202636" font-size="38" font-weight="750">Alleged summons received over chat</text>
    <g transform="translate(42 162)">
      <rect width="876" height="73" rx="11" fill="#fff" stroke="#ccd4e1"/>
      <rect x="18" y="15" width="48" height="43" rx="8" fill="#8b1731"/>
      <text x="42" y="44" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">01</text>
      <text x="85" y="43" fill="#202636" font-size="28">FICTIONAL NOTICE · Alleged summons</text>
    </g>
<g transform="translate(42 249)">
      <rect width="876" height="73" rx="11" fill="#eef1f7" stroke="#ccd4e1"/>
      <rect x="18" y="15" width="48" height="43" rx="8" fill="#8b1731"/>
      <text x="42" y="44" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">02</text>
      <text x="85" y="43" fill="#202636" font-size="28">“There’s a complaint against you.”</text>
    </g>
<g transform="translate(42 336)">
      <rect width="876" height="73" rx="11" fill="#fff" stroke="#ccd4e1"/>
      <rect x="18" y="15" width="48" height="43" rx="8" fill="#8b1731"/>
      <text x="42" y="44" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">03</text>
      <text x="85" y="43" fill="#202636" font-size="28">“Pay today and we’ll close the case.”</text>
    </g>
  </g>
</svg>
